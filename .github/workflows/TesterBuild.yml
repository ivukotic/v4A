name: DockerPush

on:
  push:
    branches:
      - "frontier"
    paths:
      - "Monitoring/**"
      - "testing/**"
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push continuous Tester Image
        uses: docker/build-push-action@v6
        with:
          context: Monitoring/
          file: Monitoring/Dockerfile
          push: true
          tags: ivukotic/varnish-conditions-tester

      - name: Build and Push Stress Tester Image
        uses: docker/build-push-action@v6
        with:
          context: testing/
          file: testing/Dockerfile
          push: true
          tags: ivukotic/varnish-conditions-stress-tester
