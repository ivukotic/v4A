name: DockerPush

on:
  push:
    branches:
      - "cvmfs"
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Docker Build & Push Action
        uses: mr-smithers-excellent/docker-build-push@v6.11
        with:
          image: ivukotic/v4cvmfs
          tags: latest, ${{ github.sha }}
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          buildArgs: BUILD_DATE=${{ env.BUILD_DATE }}
