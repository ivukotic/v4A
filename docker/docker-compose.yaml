services:
  v4f:
    image: ivukotic/v4a
    container_name: v4f
    environment:
      SITE: "<SITENAME>"
      INSTANCE: "<INSTANCE>"
      VARNISH_PORT: "8080"
      VARNISH_MEM: "8G"
      VARNISH_TRANSIENT_MEM: "500M"
    ports:
      - "6082:8080"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 24G
        reservations:
          cpus: "2.0"
          memory: 12G
    healthcheck:
      test: ["CMD", "/usr/local/bin/sender.sh"]
      interval: 9s
      timeout: 10s
      start_period: 60s
      retries: 3