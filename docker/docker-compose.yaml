services:
  v4cvmfs:
    image: ivukotic/v4cvmfs
    container_name: v4cvmfs
    environment:
      SITE: "<SITENAME>"
      INSTANCE: "<INSTANCE>"
      VARNISH_PORT: "8080"
      VARNISH_MEM: "32G"
      VARNISH_TRANSIENT_MEM: "1G"
    ports:
      - "6081:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 34G
        reservations:
          cpus: "1.0"
          memory: 33G
